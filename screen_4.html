<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        .grain-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 60;
            opacity: 0.03;
            background-image: url("https://www.transparenttextures.com/patterns/p6-dark.png");
        }

        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ken-burns {
            animation: kenburns 20s infinite alternate;
        }

        @keyframes kenburns {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .overlay-gradient {
            background: linear-gradient(to bottom, 
                rgba(50, 23, 22, 0.1) 0%, 
                rgba(50, 23, 22, 0.4) 40%, 
                rgba(50, 23, 22, 0.95) 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background selection:bg-secondary-fixed selection:text-on-secondary-fixed overflow-hidden">
<!-- Grain Texture Overlay -->
<div class="grain-texture"></div>
<!-- Onboarding Container -->
<main class="relative h-screen w-full overflow-hidden flex flex-col justify-end">
<!-- Background Image with Ken Burns effect -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center ken-burns" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAXT70RRImiz5uGUrhQbT69D8H0SkAnUtesi2WAK88kmoqziiiKLvpceza6ccjsNOzoqq5i_xdmhciK4aO8j6aepDKqp47mfSmygtlT2BYxDzrF4w9XpnBLNdMUz6pIeUTBhinUZBfmOp-iaA7xPOSbM_fzBrmIiP9AT-Mv0SxSjjTaJeK9u2xMare7atcDMwC6wqrGHbSMkYVaJTZF_pME863iBJXs-fsF23505DfpCUsAqYnlvcz0RzHQm-L-yv7ZScObMaqDks0u');"></div>
<div class="absolute inset-0 overlay-gradient"></div>
</div>
<!-- Content Canvas -->
<div class="relative z-10 px-container-margin pb-20 md:pb-32 max-w-screen-xl mx-auto w-full">
<!-- Branding -->
<header class="mb-section-gap fade-in-up" style="animation-delay: 0.2s;">
<h1 class="font-display-lg text-display-lg text-secondary-fixed-dim tracking-[0.2em] mb-2">
                    AL-HIRFA
                </h1>
<div class="h-px w-12 bg-secondary-fixed-dim/40 mb-6"></div>
</header>
<!-- Narrative Text -->
<div class="max-w-md fade-in-up" style="animation-delay: 0.5s;">
<p class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-surface-bright mb-4 leading-tight">
                    حيث تتنفس الحجارة، <br/>وتحكي الأيدي قصص الأجداد.
                </p>
<p class="font-body-lg text-body-lg text-surface-variant/80 mb-10 leading-relaxed font-light">
                    رحلة عبر الزمن في قلب الحرف اليدوية العربية، حيث كل خيط يروي تاريخاً، وكل قطعة تحمل روح صانعها.
                </p>
</div>
<!-- Action Button -->
<div class="fade-in-up" style="animation-delay: 0.8s;">
<button class="group relative flex items-center justify-between bg-secondary-fixed text-primary px-8 py-5 rounded-none overflow-hidden transition-all duration-500 hover:pr-12 active:scale-95" onclick="handleStart()">
<span class="font-label-md text-label-md uppercase tracking-widest relative z-10">اكتشف الحكاية</span>
<span class="material-symbols-outlined ml-4 group-hover:translate-x-[-8px] transition-transform duration-500 relative z-10">arrow_back</span>
<!-- Hover Effect Background -->
<div class="absolute inset-0 bg-secondary transition-transform duration-500 translate-x-full group-hover:translate-x-0"></div>
</button>
<p class="mt-8 font-caption text-caption text-on-surface-variant tracking-[0.1em] opacity-60">
                    ESTABLISHED IN HERITAGE • 2024
                </p>
</div>
</div>
<!-- Decorative Element: Asymmetric Grid Line -->
<div class="absolute right-0 top-0 h-full w-[1px] bg-white/10 hidden md:block"></div>
<div class="absolute left-12 bottom-0 w-[1px] h-1/3 bg-secondary-fixed-dim/20"></div>
</main>
<!-- Transition Layer for interactions -->
<div class="fixed inset-0 bg-primary z-[100] translate-y-full transition-transform duration-1000 ease-in-out" id="transition-layer"></div>
<script>
        function handleStart() {
            const layer = document.getElementById('transition-layer');
            layer.classList.remove('translate-y-full');
            layer.classList.add('translate-y-0');
            
            // Simulation of navigation
            setTimeout(() => {
                console.log('Navigating to stories...');
                // In a real app: window.location.href = '/stories';
            }, 1000);
        }

        // Add subtle mouse parallax for desktop
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
                document.querySelector('.ken-burns').style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
            });
        }
    </script>
