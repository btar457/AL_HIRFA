name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter Environment
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    # ✨ خطوة المعالجة التلقائية: إنشاء بيئة أندرويد مفقودة للمشروع الحالي
    - name: Recreate Android Project Platform
      run: |
        mv lib _lib_backup
        mv pubspec.yaml _pubspec_backup
        flutter create . --project-name=al_hirfa --platforms=android
        rm -rf lib pubspec.yaml
        mv _lib_backup lib
        mv _pubspec_backup pubspec.yaml

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Android APK
      run: |
        flutter build apk --release --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Al-Hirfa-App
        path: build/app/outputs/flutter-apk/app-release.apk
