name: Build Flutter APK

on:
  push:
    branches: ["claude/development-start-4zc9r8", "main"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-hirfa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to a downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "AL-HIRFA — آخر بناء تلقائي"
          body: "بناء تلقائي من فرع ${{ github.ref_name }} — commit ${{ github.sha }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
