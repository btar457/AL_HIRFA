                        "inverse-surface": "#313030",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-image: radial-gradient(#d4c3c1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            background-color: #fcf9f8;
        }
        .grain-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.03;
            background: url('https://www.transparenttextures.com/patterns/p6.png');
            z-index: 99;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<div class="grain-overlay"></div>
<!-- Header / TopAppBar (Static/Transactional Mode: Simplified) -->
<header class="w-full top-0 sticky bg-surface/80 backdrop-blur-md shadow-sm shadow-primary/5 z-50 flex justify-between items-center px-container-margin py-4">
<div class="font-display-lg text-headline-md tracking-widest text-primary uppercase">AL-HIRFA</div>
<button class="material-symbols-outlined text-primary p-2 hover:bg-surface-container-high transition-colors rounded-full" data-icon="close">close</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-section-gap">
<div class="w-full max-w-lg space-y-unit * 6">
<!-- Cinematic Intro -->
<div class="text-center space-y-4">
<span class="inline-block px-4 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-md text-label-md">
                    انضم إلى شبكة التراث
                </span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary leading-tight">
                    التسجيل كشريك شحن
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">
                    ساعدنا في ربط الحرفيين بالعالم. كن جزءاً من رحلة نقل الأصالة والإبداع عبر الحدود.
                </p>
</div>
<!-- Registration Form Card -->
<section class="bg-surface-container-lowest border border-outline-variant p-8 md:p-10 shadow-2xl shadow-primary/5 relative overflow-hidden">
<!-- Subtle Geometric Motif (Mashrabiya inspired) -->
<div class="absolute top-0 right-0 opacity-5 pointer-events-none">
<svg class="text-primary" fill="none" height="120" stroke="currentColor" viewbox="0 0 100 100" width="120">
<path d="M0 50L50 0L100 50L50 100L0 50Z"></path>
<path d="M25 50L50 25L75 50L50 75L25 50Z"></path>
</svg>
</div>
<form class="space-y-8">
<!-- Email Field -->
<div class="relative group">
<label class="block font-label-md text-label-md text-outline mb-2 transition-all group-focus-within:text-primary" for="email">
                            البريد الإلكتروني للشركة
                        </label>
<div class="flex items-center border-b border-outline-variant group-focus-within:border-primary transition-all pb-2">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-primary placeholder-outline-variant/60" id="email" name="email" placeholder="company@example.com" type="email"/>
</div>
</div>
<!-- Country Selection -->
<div class="relative group">
<label class="block font-label-md text-label-md text-outline mb-2 transition-all group-focus-within:text-primary" for="country">
                            دولة المقر
                        </label>
<div class="flex items-center border-b border-outline-variant group-focus-within:border-primary transition-all pb-2">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="public">public</span>
<select class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-primary appearance-none cursor-pointer" id="country" name="country">
<option disabled="" selected="" value="">اختر الدولة...</option>
<option value="lb">لبنان</option>
<option value="jo">الأردن</option>
<option value="eg">مصر</option>
<option value="sa">المملكة العربية السعودية</option>
<option value="ae">الإمارات العربية المتحدة</option>
<option value="ma">المغرب</option>
</select>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div><div class="relative group transition-all duration-300">
<label class="block font-label-md text-label-md text-outline mb-2 transition-all group-focus-within:text-primary" for="city">
        المدينة
    </label>
<div class="flex items-center border-b border-outline-variant group-focus-within:border-primary transition-all pb-2">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="location_city">location_city</span>
<select class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-primary appearance-none cursor-pointer" id="city" name="city">
<option disabled="" selected="" value="">اختر المدينة...</option>
<option value="beirut">بيروت</option>
<option value="riyadh">الرياض</option>
<option value="dubai">دبي</option>
<option value="cairo">القاهرة</option>
<option value="amman">عمان</option>
<option value="casablanca">الدار البيضاء</option>
</select>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary text-surface-container-lowest font-label-md text-label-md py-5 transition-all hover:bg-primary/90 active:scale-95 shadow-lg shadow-primary/20 flex justify-center items-center gap-3" type="submit">
                        إرسال طلب الانضمام
                        <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</form>
<!-- Cinematic visual element -->
<div class="mt-10 pt-8 border-t border-outline-variant/30 flex items-center gap-4">
<div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 grayscale">
<img alt="Artisan Profile" data-alt="A close-up portrait of a Lebanese artisan working in a sun-drenched workshop, his hands covered in fine dust. The lighting is dramatic and cinematic, casting deep shadows that emphasize the texture of his weathered skin. The scene is shot in a high-end editorial style with warm, earthy tones consistent with a luxury craftsmanship brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCem-iOOA3qdrZd1doygNRWQYT7Zp7zrxh4Av3_jBtMKEYKDhxEA0GmvISGgfsTZbl66Xr_jNu5t7qBJZGYEoycD3XlQBvttrbbVH47C9rq86HfzsUGY1rciY9ZCcrJxS_s-pt7NN6CkG-KkcC1TcoQHg9oM-wPKFS4Bg1ZCQaXnreqyhmXyBrBqSriiz09AvHJNoYgnLObiND8Jea5y4YHkd020f5H2UdMovp6VK4YfGtSyl8EDEQvpIJXWm4-Zkuyun6mV6iLPVqp"/>
</div>
<p class="font-caption text-caption text-on-surface-variant italic">
                        "الشحن ليس مجرد نقل بضائع، بل هو نقل لقصصنا وهويتنا إلى العالم."
                    </p>
</div>
</section>
<!-- Secondary Links -->
</div>
</main>
<!-- Contextual Footer Decoration -->
<div class="w-full h-1.5 bg-gradient-to-r from-primary via-secondary to-primary opacity-20"></div>
<script>
        // Simple Interaction logic
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('focus', () => {
                element.closest('.group').classList.add('scale-[1.02]');
            });
            element.addEventListener('blur', () => {
                element.closest('.group').classList.remove('scale-[1.02]');
            });
        });

        // Form submission animation
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = 'تم الإرسال بنجاح';
                btn.classList.replace('bg-primary', 'bg-secondary');
            }, 1500);
        });
    </script>
<button aria-label="الدعم الفني" class="fixed bottom-8 left-8 bg-secondary text-on-secondary w-14 h-14 rounded-full shadow-xl flex items-center justify-center hover:scale-110 transition-transform z-[100] group">
<span class="material-symbols-outlined" data-icon="support_agent">support_agent</span>
<span class="absolute right-full mr-4 bg-surface px-4 py-2 rounded-lg shadow-md text-label-md font-label-md whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-on-surface border border-outline-variant">
        الدعم الفني
    </span>
</button></body></html>
