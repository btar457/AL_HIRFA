<!DOCTYPE html>

                        "surface-dim": "#dcd9d9",

                        "tertiary-fixed": "#ede1c9",

                        "on-tertiary": "#ffffff",

<style>
    body {
      min-height: max(884px, 100dvh);
    }

</head>
<body class="bg-background text-on-background min-h-screen relative font-body-md selection:bg-secondary-container/30">
<div class="fixed inset-0 paper-grain pointer-events-none"></div>
<!-- Top Bar Component -->
<header class="w-full top-0 sticky z-50 bg-surface/80 backdrop-blur-md shadow-sm shadow-primary/5 flex justify-between items-center px-container-margin py-4">
<button class="active:scale-95 transition-transform duration-200 text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-wide">إضافة منتج جديد</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="max-w-2xl mx-auto px-container-margin py-unit space-y-section-gap pb-32">
<!-- Image Upload Section -->
<section class="space-y-4">
<div class="flex items-center justify-between">
<h2 class="font-headline-lg text-headline-lg-mobile text-primary">رفع صور المنتج</h2>
<span class="font-label-md text-on-surface-variant opacity-60">الحد الأقصى: ٥ صور</span>
</div>
<div class="grid grid-cols-4 gap-4 aspect-[4/3] md:aspect-[16/9]">
<!-- Main Hero Placeholder -->
<div class="col-span-3 row-span-2 relative group cursor-pointer overflow-hidden rounded-xl border border-outline-variant bg-surface-container-low flex flex-col items-center justify-center space-y-3 hover:border-secondary transition-colors">
<img class="absolute inset-0 w-full h-full object-cover opacity-20 grayscale hover:grayscale-0 transition-all duration-700" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCARySUtrpEOnDsBIc5vaZ6nN8Ar7TCU79unFmNL-6pTsrp3P0_tRbP4PBrUpGRop30DICRhJXu4uhTDnUIHCS1T1U3QswnEZOyrUqmrcyzNV4R-K-vA85mFWrYbEeWgsmxh7IXGmueGbWSkcN4CzaVTeUkrLDLhSY6p10m6J12qrgjJ_g6VgowHnC0Ud_DZ4ViYCJ8S5B40t0uQg38bVqixK2NOEZ594f-OzbQFUh8fybnMV9wRZRvmRyjs42yGxUH4cSd2LYHlsrA"/>
<div class="relative z-10 flex flex-col items-center">
<div class="w-16 h-16 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-4xl">add_a_photo</span>
</div>
<p class="font-label-md text-primary">إضافة الصورة الرئيسية</p>
<p class="font-caption text-on-surface-variant mt-1">اضغط للرفع أو السحب هنا</p>
</div>
</div>
<!-- Secondary Slots -->
<div class="col-span-1 rounded-xl border-2 border-dashed border-outline-variant/40 flex items-center justify-center bg-surface hover:bg-surface-container-high transition-colors cursor-pointer">
<span class="material-symbols-outlined text-on-surface-variant/40">image</span>
</div>
<div class="col-span-1 rounded-xl border-2 border-dashed border-outline-variant/40 flex items-center justify-center bg-surface hover:bg-surface-container-high transition-colors cursor-pointer">
<span class="material-symbols-outlined text-on-surface-variant/40">image</span>
</div>
</div>
</section>
<!-- Form Fields Section -->
<section class="space-y-gutter">
<div class="space-y-8">
<!-- Product Name -->
<div class="relative">
<input class="peer block w-full px-0 py-3 bg-transparent border-0 border-b border-outline-variant focus:ring-0 focus:border-secondary transition-all font-body-lg text-primary placeholder-transparent" id="product_name" placeholder=" " type="text" value="سجادة حرير يدوية"/>
<label class="absolute right-0 top-3 -z-10 origin-[0] -translate-y-6 scale-75 transform text-on-surface-variant transition-all peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:right-0 peer-focus:-translate-y-6 peer-focus:scale-75 peer-focus:text-secondary font-label-md" for="product_name">اسم القطعة (مثل: سجادة حرير يدوية)</label>
</div>
<!-- Product Story -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant block">قصة المنتج</label>
<div class="relative rounded-xl border border-outline-variant p-4 bg-surface focus-within:border-secondary transition-colors">
<textarea class="w-full bg-transparent border-none focus:ring-0 p-0 text-body-md text-on-surface leading-relaxed min-h-[160px] resize-none" dir="rtl" placeholder="اروي حكاية هذه القطعة، من أين استوحيت، ومن صنعها..."></textarea>
<div class="absolute bottom-4 left-4 text-on-surface-variant/30">
<span class="material-symbols-outlined">auto_stories</span>
</div>
</div>
<p class="font-caption text-on-surface-variant/60">تساعد القصص في زيادة قيمة القطعة لدى المقتنين</p>
</div>
<!-- Two Column Details -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<!-- Category Selection -->
<div class="space-y-2 custom-select-container">
<label class="font-label-md text-on-surface-variant">التصنيف</label>
<div class="relative">
<select class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3.5 font-headline-md text-primary-container focus:border-secondary focus:ring-2 focus:ring-secondary/10 appearance-none cursor-pointer transition-all shadow-sm">
<option disabled="" selected="" value="">اختر التصنيف...</option>
<option value="sculptures">منحوتات</option>
<option value="carpets">سجادات</option>
<option value="clothing">ملابس</option>
<option value="rings">محابس</option>
<option value="rosaries">مسابح</option>
<option value="perfumes">عطور</option>
<option value="vases">مزهريات</option>
<option value="handicrafts">أعمال يدوية</option>
<option value="copper_engravings">نقوش على النحاس</option>
<option value="pottery">الفخار</option><option value="calligraphy">الخط العربي</option><option value="boat_making">صناعة القوارب</option><option value="musical_instruments">الآلات الموسيقية</option><option value="amulets_gemstones">آمائم وأءار كرفمة</option><option value="paintings_calligraphy">لوأاء وشط عربى</option><option value="copper_metalwork">أعمال النءار والمعاءن</option><option value="ceramics_pottery">ءرف وفطار</option></select>
<div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none opacity-40">
<span class="material-symbols-outlined text-primary-container">category</span>
</div>
</div>
</div>
<!-- Inventory -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant">الكمية المتوفرة</label>
<div class="flex items-center border border-outline-variant rounded-xl bg-surface focus-within:border-secondary overflow-hidden h-[54px]">
<button class="px-4 py-3 text-secondary hover:bg-secondary/5 transition-colors" onclick="this.parentNode.querySelector('input').stepUp()">
<span class="material-symbols-outlined text-lg">add</span>
</button>
<input class="w-full text-center border-none focus:ring-0 font-body-md bg-transparent" min="1" type="number" value="1"/>
<button class="px-4 py-3 text-secondary hover:bg-secondary/5 transition-colors" onclick="this.parentNode.querySelector('input').stepDown()">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
</div>
</div>
</div>
<!-- Price Section -->
<div class="bg-secondary-container/10 p-6 rounded-2xl border border-secondary/10">
<label class="font-label-md text-secondary block mb-4">السعر التقديري</label>
<div class="flex items-center gap-4">
<div class="relative flex-1">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-headline-md text-primary/30">$</span>
<input class="w-full bg-surface border-0 border-b-2 border-secondary/20 focus:border-secondary focus:ring-0 text-display-lg font-display-lg text-primary text-left pr-4 pl-12 py-2" placeholder="0.00" type="number"/>
</div>
<div class="text-right hidden sm:block">
<p class="font-caption text-secondary">السعر بالدولار</p>
<p class="font-caption text-on-surface-variant">سيتوفر التحويل المحلي آلياً</p>
</div>
</div>
</div>
</div>
</section>
<!-- Aesthetic Divider -->
<div class="flex items-center justify-center gap-4 opacity-10 py-4">
<div class="h-px w-full bg-primary"></div>
<span class="material-symbols-outlined scale-150">rebase_edit</span>
<div class="h-px w-full bg-primary"></div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-lg px-container-margin pt-4 pb-8 border-t border-outline-variant/10 shadow-[0_-10px_40px_rgba(50,23,22,0.05)]">
<div class="max-w-2xl mx-auto flex items-center gap-4">
<button class="flex-1 bg-primary text-on-primary py-4 rounded-full font-label-md text-lg flex items-center justify-center gap-3 hover:bg-primary-container transition-all active:scale-95 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">publish</span>
<span>نشر المنتج</span>
</button>
<button class="w-14 h-14 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-90">
<span class="material-symbols-outlined">save</span>
</button>
</div>
</div>
<!-- Micro-interaction for inputs -->
<script>
        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                const parent = el.closest('div');
                if(parent && parent.classList.contains('rounded-xl')) {
                    parent.classList.add('shadow-md', 'shadow-secondary/5');
                }
            });
            el.addEventListener('blur', () => {
                const parent = el.closest('div');
                if(parent && parent.classList.contains('rounded-xl')) {
                    parent.classList.remove('shadow-md', 'shadow-secondary/5');
                }
            });
        });

        // Simple animation logic for appearing elements
        window.addEventListener('DOMContentLoaded', () => {
            const sections = document.querySelectorAll('section');
            sections.forEach((sec, i) => {
                sec.style.opacity = '0';
                sec.style.transform = 'translateY(20px)';
                sec.style.transition = `all 0.6s ease-out ${i * 0.1}s`;
                setTimeout(() => {
                    sec.style.opacity = '1';
                    sec.style.transform = 'translateY(0)';
                }, 100);
            });
        });
    </script>
</body></html>
